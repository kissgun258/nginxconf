# =========================================================
# [全局配置区] 核心进程与全局日志
# =========================================================

# 运行用户
user www www;

# 工作进程数 (auto = CPU 核心数)
worker_processes auto;

# [日志引用] 全局错误日志 (Nginx 启动失败、崩溃查这里)
# 路径: /www/wwwlogs/nginx_error.log
error_log /www/wwwlogs/nginx_error.log crit;

# PID 文件 (进程 ID)
pid /www/server/nginx/logs/nginx.pid;

# 文件描述符限制
worker_rlimit_nofile 51200;


# =========================================================
# [Stream 模块] TCP/UDP 转发配置
# =========================================================
stream {
    # 日志格式定义
    log_format tcp_format '$time_local|$remote_addr|$protocol|$status|$bytes_sent|$bytes_received|$session_time|$upstream_addr|$upstream_bytes_sent|$upstream_bytes_received|$upstream_connect_time';

    # [日志引用] TCP 转发日志 (数据库转发、游戏端口转发查这里)
    access_log /www/wwwlogs/tcp-access.log tcp_format;
    error_log /www/wwwlogs/tcp-error.log;

    # [文件引用] 加载所有 TCP/UDP 转发配置文件
    include /www/server/panel/vhost/nginx/tcp/*.conf;
}


# =========================================================
# [Events 模块] 连接处理
# =========================================================
events {
    use epoll;
    worker_connections 51200;
    multi_accept on;
}


# =========================================================
# [HTTP 模块] 网站服务核心配置
# =========================================================
http {
    # -----------------------------------------------------
    # 1. [文件引用] 基础依赖与外部配置加载
    # -----------------------------------------------------
    
    # 媒体类型映射 (必选)
    include mime.types;
    
    # 代理优化参数 (必选)
    include proxy.conf;
    
    # WAF 防火墙配置 (可选，去掉注释开启)
    # include luawaf.conf;

    # -----------------------------------------------------
    # 2. Lua 模块路径配置 (对应 lualib 目录)
    # -----------------------------------------------------
    lua_package_path "/www/server/nginx/lualib/?.lua;;"; 
    lua_package_cpath "/www/server/nginx/lualib/?.so;;";

    # -----------------------------------------------------
    # 3. 基础行为与性能优化
    # -----------------------------------------------------
    default_type application/octet-stream;
    
    # 传输优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    send_timeout 10;
    
    # 连接保持 (Keep-Alive)
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # 客户端限制
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 50m;      # 上传文件大小限制
    client_body_timeout 12;
    client_header_timeout 12;

    # FastCGI (PHP) 交互优化
    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 4 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_intercept_errors on;

    # Hash 表大小 (域名过长时需要)
    server_names_hash_bucket_size 512;
    server_names_hash_max_size 2048;

    # -----------------------------------------------------
    # 4. 压缩配置 (Gzip / Brotli / ZSTD)
    # -----------------------------------------------------
    
    # 压缩类型映射 (哪些文件需要压缩)
    map $sent_http_content_type $compressible {
        default 0;
        ~*application/(dash\+xml|eot|font|font-sfnt|javascript|json|opentype|otf|pkcs7-mime|protobuf|rss\+xml|truetype|ttf|vnd\.apple\.mpegurl|vnd\.mapbox-vector-tile|vnd\.ms-fontobject|xhtml\+xml|xml|x-font-opentype|x-font-truetype|x-font-ttf|x-httpd-cgi|x-javascript|x-mpegurl|x-opentype|x-otf|x-perl|x-ttf) 1;
        ~*font/(eot|opentype|otf|ttf) 1;
        ~*image/svg\+xml 1;
        ~*text/(css|csv|javascript|js|plain|richtext|tab-separated-values|xml|x-component|x-java-source|x-script) 1;
    }

    # Gzip
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_disable "msie6";
    gzip_proxied expired no-cache no-store private auth;
    gzip_types $compressible;
    gzip_static on;

    # Brotli (Google)
    brotli on;
    brotli_min_length 1024;
    brotli_comp_level 4;
    brotli_buffers 16 8k;
    brotli_static on;
    brotli_window 512k;
    brotli_types $compressible;

    # ZSTD (Facebook)
    zstd on;
    zstd_min_length 1024;
    zstd_comp_level 10;
    zstd_buffers 32 16k;
    zstd_static on;
    zstd_types $compressible;

    # -----------------------------------------------------
    # 5. SSL 安全与 HTTP/2 / HTTP/3
    # -----------------------------------------------------
    
    # 协议版本
    ssl_protocols TLSv1.2 TLSv1.3;
    http2_max_concurrent_streams 100;
    http3_max_concurrent_streams 256;
    
    # 加密套件与会话
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!MD5:!RC4';
    ssl_prefer_server_ciphers on;
    ssl_early_data on;
    ssl_buffer_size 16k;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    
    # 代理回源 SSL
    proxy_ssl_session_reuse on;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_verify off;

    # 安全响应头
    server_tokens off; # 隐藏版本号
    add_header Server "";
    add_header X-Powered-By "";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), midi=(), sync-xhr=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), fullscreen=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # -----------------------------------------------------
    # 6. 访问限制与逻辑判断
    # -----------------------------------------------------
    
    # 连接数限制
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    limit_conn perip 10;
    limit_conn perserver 100;
    limit_rate_after 2m;
    limit_rate 512k;

    # 请求频率限制
    limit_req_zone $binary_remote_addr zone=reqlimit:10m rate=10r/s;
    limit_req zone=reqlimit burst=20 nodelay;

    # 恶意 User-Agent 识别
    map $http_user_agent $bad_ua {
        default 0;
        ~*(evilbot|scanner|python-requests|go-http-client|curl|wget|libwww|httpclient|nmap|sqlmap|masscan|acunetix|nessus|dirbuster|nikto|fuzzer|crawler|bot) 1;
        ~*(fofa|FofaBot|ZoomEye|CensysInspect|Shodan|Censys) 1;
    }

    # -----------------------------------------------------
    # 7. Server 块：默认兜底与内部服务
    # -----------------------------------------------------

    # [默认 Server] 处理未绑定域名的 HTTP 请求 (直接丢弃)
    server {
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport;
        
        # 安全过滤
        if ($bad_ua) { return 444; }
        location ~* /(phpinfo|test|\.git|\.env|setup|debug|\.svn|\.htaccess|wp-config|config\.|backup|dump) { return 444; }
        location ~ /\. { return 444; }
        
        return 444; # 不返回任何内容，直接断开

        # [日志引用] 默认站点日志 (指向黑洞，不记录)
        access_log off;
        error_log /dev/null crit;
    }

    # [默认 Server] 处理未绑定域名的 HTTPS 请求 (拒绝握手)
    server {
        listen 443 ssl reuseport;
        listen [::]:443 ssl reuseport;
        http2 on;
        
        ssl_reject_handshake on; # 关键：直接拒绝非法域名的 SSL 握手
        
        if ($bad_ua) { return 444; }
        return 444;
        
        # [日志引用] 默认 SSL 日志 (不记录)
        access_log off;
        error_log /dev/null crit;
    }

    # [内部管理] phpMyAdmin 服务 (端口 888)
    server {
        listen 888;
        server_name phpmyadmin;
        root /www/server/phpmyadmin;
        index index.html index.htm index.php;

        # 访问白名单
        allow 127.0.0.1;
        allow ::1;
        deny all;

        # [文件引用] 引用 PHP 解析配置
        include enable-php.conf;

        # 静态资源缓存配置
        location ~ /tmp/ { return 403; }
        location ~* \.(gif|jpg|jpeg|png|bmp|swf|webp)$ { expires 30d; add_header Cache-Control "public, immutable"; }
        location ~* \.(js|css|woff2?|ttf|eot|svg)$ { expires 12h; add_header Cache-Control "public"; }
        location ~ /\. { deny all; return 404; }
        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt { log_not_found off; access_log off; }

        # [日志引用] phpMyAdmin 专用日志 (面板打不开数据库查这里)
        access_log /www/wwwlogs/phpmyadmin-access.log;
        error_log /www/wwwlogs/phpmyadmin-error.log;
    }

    # -----------------------------------------------------
    # 8. [文件引用] 加载所有虚拟主机 (网站) 配置
    # -----------------------------------------------------
    # 核心：这里加载你在宝塔面板中创建的所有网站配置
    include /www/server/panel/vhost/nginx/*.conf;
}



